<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kakudio social preview</title>
  <link rel="stylesheet" href="../assets/css/site.css">
  <style>
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    .card { position: relative; width: 1200px; height: 630px; padding: 110px 96px; }
    .card .wordmark { font-size: 196px; margin-bottom: 40px; }
    .card .wordmark-cursor { animation: none; }
    .card .line { font-size: 46px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; max-width: 30ch; }
    .card .url { position: absolute; top: 56px; right: 96px; font-family: var(--font-mono); font-size: 24px; color: var(--muted); letter-spacing: 0.08em; }
  </style>
</head>
<body>
  <div class="card">
    <p class="url">kakudio.dev</p>
    <h1 class="wordmark">Kakudio<span class="wordmark-cursor"></span></h1>
    <p class="line">Games are more interesting when <span class="shuffled">the rules change</span>.</p>
    <div class="ground"></div>
  </div>
</body>
</html>
