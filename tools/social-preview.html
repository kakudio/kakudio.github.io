<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kakudio social preview</title>
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/themes/spelunky/theme.css">
  <style>
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    .card { display: block; width: 1200px; height: 630px; min-height: 0; padding: 130px 0 0; }
    .card .wrap { max-width: none; padding-inline: 96px; }
    .card .wordmark { font-size: 180px; margin-bottom: 36px; }
    .card .line { font-family: var(--font-display); font-weight: var(--display-weight); letter-spacing: var(--display-tracking); font-size: 46px; line-height: 1.1; max-width: 30ch; }
    .card .url { position: absolute; top: 40px; right: 96px; margin: 0; font-family: var(--font-label); font-size: 26px; color: var(--muted); letter-spacing: var(--label-tracking); }
  </style>
</head>
<body>
  <header class="hero card">
    <div class="wrap">
      <p class="url">kakudio.dev</p>
      <h1 class="wordmark">Kakudio</h1>
      <p class="line">Games are more interesting when <span class="shuffled">the rules change</span>.</p>
    </div>
    <div class="ground"></div>
  </header>
</body>
</html>
